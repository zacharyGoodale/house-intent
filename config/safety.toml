# Default safety rules with examples from the fictional StubHA registry.
# The denylist (decisions 3, 5, 6). The ONLY place entity_ids appear outside scope.toml (spec §6.1).
denied_domains = ["lock", "alarm_control_panel", "button"]
denied_entities = ["lock.entry_lock", "script.toggle_entry_lock", "button.entry_signal"]

# Covers (decision 5: garage doors and gates are refused by default). A cover is controllable only when its
# device_class is on the allowlist; an unset device_class (common for template, MQTT and Shelly covers) is refused.
denied_cover_device_classes = ["garage", "gate", "door"]
allowed_cover_device_classes = ["awning", "blind", "curtain", "shade", "shutter", "window"]
# A cover in an area whose name matches this is refused even with an allowed device_class (a roll-up
# garage door is often class "shutter").
security_area_pattern = "(?i)\\bgarage\\b|\\bgate\\b|\\bdriveway\\b|\\bcarport\\b"

# The name rule: applies to covers, switches (relays), scripts, scenes, automations and presets, on the
# entity_id's object id and the friendly name. Word boundaries keep "clock", "block", "tailgate" and
# "outdoor" out; bare "garage" is not in it, so garage lights stay controllable.
denied_name_pattern = "(?i)\\b(un)?lock(s|ed|ing)?\\b|\\bdead ?bolts?\\b|\\bdisarm(s|ed|ing)?\\b|\\bgates?\\b|\\bdoors?\\b|\\bstrikes?\\b|\\b(un)?latch(es|ed|ing)?\\b|\\bopeners?\\b|\\bbuzz(er|ers)?\\b|\\brelease\\b|\\bentry\\b|\\bentrance\\b"

# Decision 5, "until the user decides otherwise": entities listed here skip the heuristics above (unknown
# cover device_class, area rule, name rule). They never skip denied_domains, denied_entities, a denied cover
# device_class, or a script/scene/automation whose definition touches a denied entity.
allowed_entities = []
